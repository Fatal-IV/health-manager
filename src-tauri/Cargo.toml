[package]
name = "app"
version = "0.3.3"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
health-core = { path = "../crates/health-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
getrandom = "0.3"
ureq = "2"
minisign-verify = "0.2"
base64 = "0.22"

[dev-dependencies]
health-core = { path = "../crates/health-core", features = ["testing"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
